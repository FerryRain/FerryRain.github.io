<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-labelledby="title desc">
  <title id="title">ManiTrack robotic hand tracking illustration</title>
  <desc id="desc">Conceptual rendering of a tracked dexterous robot hand with URDF joint locations and a visibility-aware tracking outline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2138"/>
      <stop offset="0.57" stop-color="#16344e"/>
      <stop offset="1" stop-color="#0b2941"/>
    </linearGradient>
    <linearGradient id="palm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9d5f5"/>
      <stop offset="1" stop-color="#557aa3"/>
    </linearGradient>
    <linearGradient id="finger" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e5f2ff"/>
      <stop offset="0.53" stop-color="#a5c7e7"/>
      <stop offset="1" stop-color="#5c90bf"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#80b8de" stroke-width="0.7" opacity="0.13"/>
    </pattern>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#1c7bb4" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#1c7bb4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="360" fill="url(#bg)"/>
  <rect width="600" height="360" fill="url(#grid)"/>
  <ellipse cx="307" cy="182" rx="210" ry="175" fill="url(#glow)"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="28" y="47" fill="#eff8ff" font-weight="700" font-size="32" letter-spacing="1.1">MANITRACK</text>
    <text x="30" y="70" fill="#9bc8e7" font-size="12" letter-spacing="2.05">3D ROBOT HAND TRACKING</text>
  </g>

  <!-- Kinematic tracking region -->
  <rect x="163" y="38" width="277" height="268" rx="15" fill="none" stroke="#48c8e5" stroke-width="1.6" stroke-dasharray="8 7" opacity=".52"/>
  <path d="M163 68 v-30 h31 M410 38 h30 v30 M163 277 v29 h31 M410 306 h30 v-29" stroke="#49d6ee" stroke-width="3" fill="none" opacity=".9"/>

  <!-- Ghosted predicted configuration -->
  <g fill="none" stroke="#37e0ce" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 9" opacity=".49" transform="translate(11 -8)">
    <path d="M264 182 L249 121 L257 74"/>
    <path d="M289 167 L296 100 L299 52"/>
    <path d="M317 171 L333 111 L351 73"/>
    <path d="M344 183 L368 143 L391 116"/>
    <path d="M251 220 L213 186 L190 145"/>
    <path d="M275 192 L290 173 L330 175 L356 200 L357 244 L332 278 L281 279 Z"/>
  </g>

  <!-- Robot wrist and palm -->
  <path d="M287 270 L333 271 L335 319 L283 319 Z" fill="url(#palm)" stroke="#a7d5f3" stroke-width="4"/>
  <path d="M283 305 H334 M286 312 H333" stroke="#467392" stroke-width="3" opacity=".7"/>
  <path d="M266 184 Q266 173 280 170 L322 167 Q338 168 348 185 L369 229 Q370 242 359 251 L332 281 Q325 287 311 287 L277 283 Q268 280 263 266 L246 216 Q243 203 251 194 Z" fill="url(#palm)" stroke="#d8edff" stroke-width="3.5"/>
  <path d="M279 205 L331 204 L350 236 L321 264 L282 258 Z" fill="#1d4767" opacity=".35"/>
  <path d="M271 228 L291 245 L323 245" stroke="#c8e6ff" opacity=".45" stroke-width="3" fill="none"/>

  <!-- Articulated fingers: dark outlines then metal links -->
  <g fill="none" stroke="#245175" stroke-width="25" stroke-linecap="round" stroke-linejoin="round">
    <path d="M258 208 L218 182 L190 145"/>
    <path d="M274 184 L253 124 L259 75"/>
    <path d="M294 175 L296 106 L298 54"/>
    <path d="M320 177 L338 117 L352 76"/>
    <path d="M343 191 L368 147 L392 118"/>
  </g>
  <g fill="none" stroke="url(#finger)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <path d="M258 208 L218 182 L190 145"/>
    <path d="M274 184 L253 124 L259 75"/>
    <path d="M294 175 L296 106 L298 54"/>
    <path d="M320 177 L338 117 L352 76"/>
    <path d="M343 191 L368 147 L392 118"/>
  </g>

  <!-- The projected URDF skeleton -->
  <g fill="none" stroke="#56e3dc" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" opacity=".97">
    <path d="M258 208 L218 182 L190 145"/>
    <path d="M274 184 L253 124 L259 75"/>
    <path d="M294 175 L296 106 L298 54"/>
    <path d="M320 177 L338 117 L352 76"/>
    <path d="M343 191 L368 147 L392 118"/>
    <path d="M259 210 L275 240 L309 274 L333 245 L343 191"/>
    <path d="M275 240 L294 175 L309 274 L320 177"/>
  </g>
  <!-- Joint landmarks -->
  <g fill="#ffbf67" stroke="#0e3750" stroke-width="3">
    <circle cx="190" cy="145" r="6.5"/><circle cx="218" cy="182" r="6.5"/><circle cx="258" cy="208" r="6.5"/>
    <circle cx="259" cy="75" r="6.5"/><circle cx="253" cy="124" r="6.5"/><circle cx="274" cy="184" r="6.5"/>
    <circle cx="298" cy="54" r="6.5"/><circle cx="296" cy="106" r="6.5"/><circle cx="294" cy="175" r="6.5"/>
    <circle cx="352" cy="76" r="6.5"/><circle cx="338" cy="117" r="6.5"/><circle cx="320" cy="177" r="6.5"/>
    <circle cx="392" cy="118" r="6.5"/><circle cx="368" cy="147" r="6.5"/><circle cx="343" cy="191" r="6.5"/>
    <circle cx="275" cy="240" r="6.5"/><circle cx="309" cy="274" r="6.5"/><circle cx="333" cy="245" r="6.5"/>
  </g>

  <!-- Minimal tracking frame metadata -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing=".7">
    <rect x="431" y="103" width="135" height="25" rx="6" fill="#102f4a" stroke="#2b6c94"/>
    <circle cx="446" cy="115" r="4" fill="#55e1c6"/>
    <text x="457" y="119" fill="#d7effb">POSE TRACKING</text>
    <path d="M416 145 L461 145" stroke="#4dc9e2" stroke-width="1.2" stroke-dasharray="4 4" opacity=".7"/>
    <text x="464" y="149" fill="#95bed5" font-size="10">URDF</text>
  </g>
  <rect x="0" y="330" width="600" height="30" fill="#0a1b2f" opacity=".85"/>
  <text x="28" y="350" fill="#8fb1cb" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="1.3">CONCEPTUAL ILLUSTRATION</text>
  <g stroke="#4b98c1" stroke-width="1.5" opacity=".6">
    <path d="M490 343 h65"/>
    <path d="M545 336 l10 7 -10 7" fill="none"/>
  </g>
</svg>